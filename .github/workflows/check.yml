name: Check portable dispatch

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-acceptance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m sa_dispatch selftest
